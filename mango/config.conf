source=~/.config/mango/theme.conf

exec_once=waybar
exec_once=swaybg
exec_once=swayosd-server
exec_once=swaybg -i ~/pictures/thumb_shop_jp.jpg -m fill

blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=2
blur_params_noise=0.02
blur_params_brightness=1.0
blur_params_contrast=1.0
blur_params_saturation=1.0

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.93

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.4
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8

animation_duration_move=100
animation_duration_open=100
animation_duration_tag=100
animation_duration_close=100
animation_duration_focus=100

animation_curve_open=0.15,0,0.1,1
animation_curve_move=0.15,0,0.1,1
animation_curve_tag=0.15,0,0.1,1
animation_curve_close=0.15,0,0.1,1
animation_curve_focus=0.15,0,0.1,1
animation_curve_opacity_fade_out=0.15,0,0.1,1
animation_curve_opacity_fade_in=0.15,0,0.1,1

scroller_structs=0
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=0.5,0.7,1.0

new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9

gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
smart_gaps=0

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

hotarea_size=10
enable_hotarea=1
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=5
overcircle_center_ratio=0.75

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_natural_scrolling=0

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

border_px=2

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

bind=super+shift,r,reload_config

bind=super,space,spawn,rofi -show drun -show-icons
bind=super,k,spawn,rofi -dmenu -i -p Keybinds -input "$HOME/.config/mango/keybinds.txt"
bind=super,w,spawn,networkmanager_dmenu
bind=super,Return,spawn,kitty
bind=super,backslash,spawn,brave-origin
bind=super,l,spawn,kitty yazi

bind=super,q,killclient
bind=super+shift,e,quit
bind=super,v,togglefloating
bind=super,m,togglemaximizescreen
bind=super+shift,p,spawn,shutdown now

bind=super,Left,focusdir,left
bind=super,Right,focusdir,right
bind=super,Up,focusdir,up
bind=super,Down,focusdir,down
bind=super+shift,Left,exchange_client,left
bind=super+shift,Right,exchange_client,right
bind=super+shift,Up,exchange_client,up
bind=super+shift,Down,exchange_client,down

bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0

bind=super+shift,1,tag,1,0
bind=super+shift,2,tag,2,0
bind=super+shift,3,tag,3,0
bind=super+shift,4,tag,4,0
bind=super+shift,5,tag,5,0
bind=super+shift,6,tag,6,0
bind=super+shift,7,tag,7,0
bind=super+shift,8,tag,8,0
bind=super+shift,9,tag,9,0

bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

bind=ctrl+super,Up,resizewin,+0,-15
bind=ctrl+super,Down,resizewin,+0,+15
bind=ctrl+super,Right,resizewin,+15,+0
bind=ctrl+super,Left,resizewin,-15,+0

bind=super+shift,x,incgaps,1
bind=super+shift,z,incgaps,-1

bind=super,i,minimized
bind=super,g,restore_minimized
bind=super,Escape,toggleoverview
bind=super,z,toggle_scratchpad
bind=super,f,togglefullscreen

mousebind=super,btn_left,moveresize,curmove
mousebind=super,btn_right,moveresize,curresize

mouse_scroll_method=4
mouse_scroll_button=274

bind=NONE,Print,spawn_shell,file="$HOME/pictures/shot_$(date +%s).png"; grim "$file" && notify-send -i "$file" "Screenshot" "Picture saved to $file"
bind=shift,Print,spawn_shell,$HOME/.config/mango/sccrop.sh

bind=NONE,F1,spawn,swayosd-client --output-volume mute-toggle
bind=NONE,F2,spawn,swayosd-client --output-volume lower
bind=NONE,F3,spawn,swayosd-client --output-volume raise
bind=NONE,F4,spawn,swayosd-client --brightness lower
bind=NONE,F5,spawn,swayosd-client --brightness raise
bind=NONE,F9,spawn,swayosd-client --input-volume mute-toggle

layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=no_blur:1,layer_name:selection
layer_rule=no_blur:1,layer_name:swayosd

