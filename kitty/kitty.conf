include solarized-dark.conf

adjust_line_height 1

shell_integration no-cursor
cursor #dc322f
cursor_text_color #000000
cursor_shape block

window_padding_width 2
window_padding_height 2

font_family JetBrains Mono Light
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9.25
font_features none
modify_font underline_position 5

enable_audio_bell yes

